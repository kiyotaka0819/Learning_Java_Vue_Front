update-readme:
  needs: build-and-deploy
  if: github.actor != 'github-actions[bot]'
  runs-on: ubuntu-latest
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # 常に最新のmainブランチをチェックアウトする
        ref: main

    - name: Update README Section
      run: |
        git pull origin main

        echo "## 更新履歴" > updates.tmp
        git log -25 --pretty=format:"- **%ad**: %s" --date=format:"%m-%d %H:%M" >> updates.tmp         
        if grep -q "## 更新履歴" README.md; then
          sed -i '/## 更新履歴/,$d' README.md
        fi
        cat updates.tmp >> README.md
        rm updates.tmp

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add README.md
        git commit -m "chore: update readme log [skip ci]" || exit 0 
        git push origin main
