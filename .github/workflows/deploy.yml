name: Deploy and Update README

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # --- ジョブ1: ビルドとデプロイ ---
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build
        run: |
          npm install
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  # --- ジョブ2: READMEの更新履歴をアップデート ---
  update-readme:
    if: "!contains(github.event.head_commit.message, 'chore: update readme log')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Update README Section
        run: |
          echo "## 💾 Recent System Updates (Latest 25)" > updates.tmp
          git log -25 --pretty=format:"- **%ad**: %s" --date=format:"%m-%d %H:%M" >> updates.tmp
          
          if grep -q "## 💾 Recent System Updates" README.md; then
            sed -i '/## 💾 Recent System Updates/,$d' README.md
          fi
          cat updates.tmp >> README.md
          rm updates.tmp
          
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "chore: update readme log [skip ci]"
          git push